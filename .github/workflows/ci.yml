name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      packages: ${{ steps.filter.outputs.packages }}
      playground: ${{ steps.filter.outputs.playground }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'packages/docs/instructions.md'
              - 'packages/docs/annotations.md'
              - 'packages/docs/src/content/docs/**'
              - 'packages/playground/examples/**'
              - 'grammars/tree-sitter-wat/**'
              - 'tests/**'
            packages:
              - 'packages/**'
              - 'src/**'
              - 'grammars/tree-sitter-wat/**'
            playground:
              - 'packages/playground/**'
              - 'packages/**'
              - 'grammars/tree-sitter-wat/**'
              - 'src/**'
              - 'tests/diagnostic_corpus/**'
            docs:
              - 'packages/docs/**'

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Add npm global bin to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "$env:APPDATA\npm" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate tree-sitter parser
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter generate

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (native)
        run: cargo test --features native --verbose

      - name: Run tests (native, release mode)
        run: cargo test --features native --release --verbose

      - name: Validate example files with wat-check
        shell: bash
        run: |
          cargo build --features native --release --bin wat-check
          wrong=()

          echo "Valid examples (should pass):"
          for file in packages/playground/examples/*.wat; do
            base=$(basename "$file")
            if ./target/release/wat-check "$file" > /dev/null 2>&1; then
              echo "  ok    $base"
            else
              echo "  FAIL  $base"
              wrong+=("$file: expected pass, got fail")
            fi
          done

          echo ""
          echo "Invalid examples (should fail):"
          for file in packages/playground/examples/invalid/*.wat; do
            base=$(basename "$file")
            if ./target/release/wat-check "$file" > /dev/null 2>&1; then
              echo "  FAIL  $base"
              wrong+=("$file: expected fail, got pass")
            else
              echo "  ok    $base"
            fi
          done

          echo ""
          if [ ${#wrong[@]} -gt 0 ]; then
            echo "Failures (${#wrong[@]}):"
            for entry in "${wrong[@]}"; do
              echo "  - $entry"
            done
            exit 1
          fi
          echo "All examples validated correctly"

      - name: Validate linearized examples
        shell: bash
        run: |
          npx tsx scripts/check-linearized-examples.ts

      - name: Check hover documentation coverage
        run: cargo run --features native --release --bin wat-hover-coverage

  validate-wasm-tools:
    name: Validate Examples (wasm-tools)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install wasm-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo bytecodealliance/wasm-tools --pattern '*x86_64-linux*' --output wasm-tools.tar.gz
          tar xzf wasm-tools.tar.gz
          sudo cp wasm-tools-*/wasm-tools /usr/local/bin/
          wasm-tools --version

      - name: Validate valid examples with wasm-tools
        shell: bash
        run: |
          wrong=()

          echo "Valid examples (wasm-tools validate):"
          for file in packages/playground/examples/*.wat; do
            base=$(basename "$file")
            if wasm-tools validate "$file" > /dev/null 2>&1; then
              echo "  ok    $base"
            else
              echo "  FAIL  $base"
              wasm-tools validate "$file" 2>&1 || true
              wrong+=("$base")
            fi
          done

          echo ""
          if [ ${#wrong[@]} -gt 0 ]; then
            echo "Failures (${#wrong[@]}):"
            for entry in "${wrong[@]}"; do
              echo "  - $entry"
            done
            exit 1
          fi
          echo "All valid examples pass wasm-tools validate"

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Generate tree-sitter parser
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter generate

      - name: Build tree-sitter WASM
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter build --wasm

      - name: Run clippy (native)
        run: cargo clippy --features native --all-targets -- -D warnings

      - name: Run clippy (wasm)
        run: cargo clippy --features wasm --no-default-features --lib -- -D warnings

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build Native
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Add npm global bin to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "$env:APPDATA\npm" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate tree-sitter parser
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter generate

      - name: Build release binary
        run: cargo build --features native --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wat-lsp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/wat-lsp-rust${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  build-wasm:
    name: Build WASM
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.14.0'

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Generate tree-sitter parser
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter generate

      - name: Build tree-sitter WASM
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter build --wasm

      - name: Build WASM package
        run: wasm-pack build --target web --no-pack -- --features wasm --no-default-features

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v6
        with:
          name: wat-lsp-wasm
          path: |
            pkg/wat_lsp_rust.js
            pkg/wat_lsp_rust.d.ts
            pkg/wat_lsp_rust_bg.wasm
            pkg/package.json

  build-npm-package:
    name: Build NPM Package
    needs: changes
    if: needs.changes.outputs.packages == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.14.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Generate tree-sitter parser
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter generate

      - name: Build tree-sitter WASM
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter build --wasm

      - name: Build WASM module
        run: wasm-pack build --target web --no-pack -- --features wasm --no-default-features

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NPM package
        working-directory: packages/wat-lsp
        run: |
          mkdir -p dist/wasm
          cp ../../pkg/wat_lsp_rust.js dist/wasm/
          cp ../../pkg/wat_lsp_rust.d.ts dist/wasm/
          cp ../../pkg/wat_lsp_rust_bg.wasm dist/wasm/
          pnpm run build:wrapper
          pnpm run build:assets

      - name: Upload NPM package artifact
        uses: actions/upload-artifact@v6
        with:
          name: emnudge-wat-lsp
          path: packages/wat-lsp/dist

      - name: Cache NPM package for future runs
        uses: actions/cache/save@v4
        with:
          path: packages/wat-lsp/dist
          key: npm-package-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'grammars/tree-sitter-wat/**', 'packages/wat-lsp/src/**') }}

  security-audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Generate tree-sitter parser
        working-directory: grammars/tree-sitter-wat
        run: tree-sitter generate

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  validate-wasm:
    name: Validate Examples (WASM)
    needs: [changes, build-npm-package]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.packages == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Clean package directory
        run: rm -rf packages/wat-lsp/dist packages/wat-lsp/node_modules

      # Try to restore from cache first
      - name: Restore NPM package from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: packages/wat-lsp/dist
          key: npm-package-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'grammars/tree-sitter-wat/**', 'packages/wat-lsp/src/**') }}

      # If cache miss and build-npm-package ran, download the artifact
      - name: Download NPM package artifact
        if: steps.cache-restore.outputs.cache-hit != 'true' && needs.build-npm-package.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: emnudge-wat-lsp
          path: packages/wat-lsp/dist

      - name: Verify package structure
        run: |
          if [ ! -d "packages/wat-lsp/dist/wasm" ]; then
            echo "ERROR: NPM package not available!"
            exit 1
          fi
          ls -la packages/wat-lsp/dist/wasm/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate example files with wat-check-wasm
        shell: bash
        run: |
          wrong=()

          echo "Valid examples (should pass):"
          for file in packages/playground/examples/*.wat; do
            base=$(basename "$file")
            if node packages/wat-lsp/bin/wat-check-wasm.js "$file" > /dev/null 2>&1; then
              echo "  ok    $base"
            else
              echo "  FAIL  $base"
              wrong+=("$file: expected pass, got fail")
            fi
          done

          echo ""
          echo "Invalid examples (should fail):"
          for file in packages/playground/examples/invalid/*.wat; do
            base=$(basename "$file")
            if node packages/wat-lsp/bin/wat-check-wasm.js "$file" > /dev/null 2>&1; then
              echo "  FAIL  $base"
              wrong+=("$file: expected fail, got pass")
            else
              echo "  ok    $base"
            fi
          done

          echo ""
          if [ ${#wrong[@]} -gt 0 ]; then
            echo "Failures (${#wrong[@]}):"
            for entry in "${wrong[@]}"; do
              echo "  - $entry"
            done
            exit 1
          fi
          echo "All examples validated correctly (WASM)"

  test-wasm-e2e:
    name: Test WASM E2E
    needs: [changes, build-npm-package]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.packages == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Clean package directory
        run: rm -rf packages/wat-lsp/dist packages/wat-lsp/node_modules

      - name: Restore NPM package from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: packages/wat-lsp/dist
          key: npm-package-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'grammars/tree-sitter-wat/**', 'packages/wat-lsp/src/**') }}

      - name: Download NPM package artifact
        if: steps.cache-restore.outputs.cache-hit != 'true' && needs.build-npm-package.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: emnudge-wat-lsp
          path: packages/wat-lsp/dist

      - name: Verify package structure
        run: |
          if [ ! -d "packages/wat-lsp/dist/wasm" ]; then
            echo "ERROR: NPM package not available!"
            exit 1
          fi
          ls -la packages/wat-lsp/dist/wasm/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run WASM E2E tests
        run: pnpm --filter @emnudge/wat-lsp test

  playground-build:
    name: Playground Build
    needs: [changes, build-npm-package]
    # Run if playground changed, OR if rust changed (and build-npm-package ran)
    # The 'always()' allows this to run even if build-npm-package was skipped
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.changes.outputs.playground == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Clean package directory
        run: rm -rf packages/wat-lsp/dist packages/wat-lsp/node_modules

      # Try to restore from cache first (fast path for playground-only changes)
      - name: Restore NPM package from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: packages/wat-lsp/dist
          key: npm-package-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'grammars/tree-sitter-wat/**', 'packages/wat-lsp/src/**') }}

      # If cache miss and build-npm-package ran, download the artifact
      - name: Download NPM package artifact
        if: steps.cache-restore.outputs.cache-hit != 'true' && needs.build-npm-package.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: emnudge-wat-lsp
          path: packages/wat-lsp/dist

      - name: Verify package structure
        run: |
          echo "Cache hit: ${{ steps.cache-restore.outputs.cache-hit }}"
          echo "Build job result: ${{ needs.build-npm-package.result }}"
          echo "Package contents:"
          ls -la packages/wat-lsp/
          if [ ! -d "packages/wat-lsp/dist/wasm" ]; then
            echo "ERROR: NPM package not available!"
            echo "This can happen on first run - try re-running the workflow after build-npm-package succeeds."
            exit 1
          fi
          ls -la packages/wat-lsp/dist/
          ls -la packages/wat-lsp/dist/wasm/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup playground assets
        working-directory: packages/playground
        run: pnpm run setup

      - name: Build playground
        working-directory: packages/playground
        run: pnpm run build

      - name: Upload playground build
        uses: actions/upload-artifact@v6
        with:
          name: playground-dist
          path: packages/playground/dist/

  playground-test:
    name: Playground Test
    needs: [changes, playground-build]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.changes.outputs.playground == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm

      - name: Download playground build
        uses: actions/download-artifact@v7
        with:
          name: playground-dist
          path: packages/playground/dist/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/playground
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: packages/playground
        run: pnpm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: packages/playground/playwright-report/
          retention-days: 7

  deploy-pages:
    name: Deploy to Cloudflare Pages
    needs: playground-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download playground build
        uses: actions/download-artifact@v7
        with:
          name: playground-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wat-lsp --branch=${{ github.head_ref || github.ref_name }}

  docs-lint:
    name: Docs Lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wat-docs run lint

  docs-lint-instructions:
    name: Docs Lint Instructions
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node packages/docs/scripts/lint-instructions.mjs

  docs-format:
    name: Docs Format
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wat-docs run format

  docs-typecheck:
    name: Docs Typecheck
    needs: [changes, build-npm-package]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Clean package directory
        run: rm -rf packages/wat-lsp/dist packages/wat-lsp/node_modules
      - name: Restore NPM package from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: packages/wat-lsp/dist
          key: npm-package-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'grammars/tree-sitter-wat/**', 'packages/wat-lsp/src/**') }}
      - name: Download NPM package artifact
        if: steps.cache-restore.outputs.cache-hit != 'true' && needs.build-npm-package.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: emnudge-wat-lsp
          path: packages/wat-lsp/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wat-docs run typecheck

  docs-build:
    name: Docs Build
    needs: [changes, build-npm-package, playground-build]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.changes.outputs.docs == 'true' || needs.changes.outputs.playground == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Clean package directory
        run: rm -rf packages/wat-lsp/dist packages/wat-lsp/node_modules
      - name: Restore NPM package from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: packages/wat-lsp/dist
          key: npm-package-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'grammars/tree-sitter-wat/**', 'packages/wat-lsp/src/**') }}
      - name: Download NPM package artifact
        if: steps.cache-restore.outputs.cache-hit != 'true' && needs.build-npm-package.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: emnudge-wat-lsp
          path: packages/wat-lsp/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wat-docs run build

      - name: Download playground build
        if: needs.playground-build.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: playground-dist
          path: packages/docs/dist/playground/

      - name: Upload docs site
        uses: actions/upload-artifact@v6
        with:
          name: docs-dist
          path: packages/docs/dist/

  docs-test-wat:
    name: Docs Test WAT
    needs: [changes, build-npm-package]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Clean package directory
        run: rm -rf packages/wat-lsp/dist packages/wat-lsp/node_modules
      - name: Restore NPM package from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: packages/wat-lsp/dist
          key: npm-package-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'grammars/tree-sitter-wat/**', 'packages/wat-lsp/src/**') }}
      - name: Download NPM package artifact
        if: steps.cache-restore.outputs.cache-hit != 'true' && needs.build-npm-package.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: emnudge-wat-lsp
          path: packages/wat-lsp/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wat-docs run test:wat

  docs-test:
    name: Docs Test
    needs: [changes, build-npm-package]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Clean package directory
        run: rm -rf packages/wat-lsp/dist packages/wat-lsp/node_modules
      - name: Restore NPM package from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: packages/wat-lsp/dist
          key: npm-package-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'grammars/tree-sitter-wat/**', 'packages/wat-lsp/src/**') }}
      - name: Download NPM package artifact
        if: steps.cache-restore.outputs.cache-hit != 'true' && needs.build-npm-package.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: emnudge-wat-lsp
          path: packages/wat-lsp/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wat-docs exec playwright install --with-deps chromium
      - run: pnpm --filter wat-docs test

  deploy-docs:
    name: Deploy Docs to Cloudflare Pages
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Download docs build
        uses: actions/download-artifact@v7
        with:
          name: docs-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wat-docs --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: mskelton/omni-comment@v2.3.0
        with:
          section: docs_preview
          title: Docs Preview
          message: |
            Deployed to Cloudflare Pages:
            ${{ steps.deploy.outputs.deployment-url }} (`${{ github.event.pull_request.head.sha }}`)

            [Playground](${{ steps.deploy.outputs.deployment-url }}/playground/)
